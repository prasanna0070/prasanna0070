name: profile

# Rebuilds the stats card and project cards from live GitHub data, and draws the contribution snake.
on:
  schedule:
    - cron: "40 0 * * *"   # 06:10 IST every day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/fonts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SVGs from live data
        run: python scripts/build_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "cards: refresh from live GitHub data"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#E76F2A&color_dots=#EFEBE7,#F8C9A8,#F2A06B,#E76F2A,#A9481A
            dist/snake-dark.svg?palette=github-dark&color_snake=#E76F2A&color_dots=#1C1C1D,#4A2412,#7E3A18,#C2591F,#FF9A57
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
